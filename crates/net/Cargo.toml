[package]
name = "transom-net"
description = "Identity, storage, discovery, pairing and sessions against a Sill host."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The in-process mock host (src/mock.rs): the integration tests and examples/mockhost.rs.
mock = []

[dependencies]
transom-proto.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio.workspace = true
rcgen.workspace = true
mdns-sd.workspace = true
directories.workspace = true
getrandom.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
transom-net = { path = ".", features = ["mock"] }
env_logger.workspace = true

[[example]]
name = "mockhost"
required-features = ["mock"]
