name: Release

# Builds three downloads: a portable Windows zip (Transom plus FFmpeg's LGPL DLLs), a Linux
# AppImage and a Linux .deb (both with a private copy of FFmpeg's shared libraries). Push a tag
# like v0.1.0 to attach all three to one GitHub Release, or run it by hand to get them as workflow
# artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FFMPEG_NAME: ffmpeg-n9.0-latest-win64-lgpl-shared-9.0

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Install FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_NAME.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP"
          $dir = Join-Path $env:RUNNER_TEMP $env:FFMPEG_NAME
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $dir "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # The static C runtime means the zip runs without the Visual C++ Redistributable.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release -p transom --bins
      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $name = "transom-$ver-windows-x64"
          $out = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $out, "$out\licenses" | Out-Null
          Copy-Item target\release\transom.exe, target\release\transom-gui.exe $out
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $out
          Copy-Item README.md, LICENSE, NOTICE $out
          Copy-Item "$env:FFMPEG_DIR\LICENSE.txt" "$out\licenses\FFmpeg-LICENSE.txt"
          @"
          Transom for Windows
          ===================

          Unzip anywhere and double-click transom-gui.exe. Keep the DLLs next to it.
          transom.exe is the command-line version (run it from a terminal).

          Windows may warn that the app is from an unknown publisher, because it is not
          code-signed. Choose "More info", then "Run anyway".

          This package includes FFmpeg ($env:FFMPEG_NAME, https://ffmpeg.org), licensed under
          the GNU LGPL version 2.1 or later; see licenses\FFmpeg-LICENSE.txt. FFmpeg's source
          is available from https://github.com/BtbN/FFmpeg-Builds and https://ffmpeg.org.
          "@ | Set-Content "$out\READ ME FIRST.txt"
          Compress-Archive -Path $out -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Smoke test
        shell: pwsh
        run: |
          Expand-Archive $env:ZIP -DestinationPath smoke
          $dir = Get-ChildItem smoke | Select-Object -First 1
          # A clean PATH proves the bundled DLLs are the ones loaded.
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & "$($dir.FullName)\transom.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: transom-windows-x64
          path: ${{ env.ZIP }}
          if-no-files-found: error

  linux-build:
    # Built in a 22.04 container (glibc 2.35) so the result runs on 22.04 and newer. The
    # ubuntu-22.04 runner label is deprecated.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.ver.outputs.appver }}
    env:
      LINUX_FFMPEG_TAG: autobuild-2026-09-30-13-08
      LINUX_FFMPEG_NAME: ffmpeg-n9.0.2-17-g2a571b6068-linux64-lgpl-shared-9.0
      LINUX_FFMPEG_SHA256: 7a1ba2af36e5beeb98151e766a903b1d115f2206a86571f17f873cd7292c424f
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      # Before checkout, so that checkout uses git.
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config clang libclang-dev file desktop-file-utils xz-utils jq
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
      - name: Install FFmpeg
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$LINUX_FFMPEG_TAG/$LINUX_FFMPEG_NAME.tar.xz"
          echo "$LINUX_FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          echo "FFMPEG_DIR=$RUNNER_TEMP/$LINUX_FFMPEG_NAME" >> "$GITHUB_ENV"
      - name: Install AppImage tools
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool-x86_64.AppImage" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool-x86_64.AppImage" | sha256sum -c -
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/runtime-x86_64" "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Version
        id: ver
        run: |
          APPVER=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name=="transom") | .version')
          [ -n "$APPVER" ] || { echo "::error::could not read transom crate version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="$GITHUB_REF_NAME"
            DEBVER="$APPVER"
            if [ "${GITHUB_REF_NAME#v}" != "$APPVER" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match crate version $APPVER"
              exit 1
            fi
          else
            VER="dev-${GITHUB_SHA::7}"
            DEBVER="${APPVER}~dev+g${GITHUB_SHA::7}"
          fi
          {
            echo "VER=$VER"
            echo "DEBVER=$DEBVER"
            echo "APPVER=$APPVER"
          } >> "$GITHUB_ENV"
          echo "appver=$APPVER" >> "$GITHUB_OUTPUT"
      # DT_RPATH (not RUNPATH) so the rpath also covers the dependencies of the FFmpeg libraries.
      - name: Build
        env:
          RUSTFLAGS: -C link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib/transom
        run: cargo build --locked --release -p transom --bins
      - name: Stage
        run: bash packaging/linux/stage-usr.sh target/release "$FFMPEG_DIR" "$LINUX_FFMPEG_NAME" "$LINUX_FFMPEG_TAG" "$RUNNER_TEMP/stage/usr"
      - name: AppImage
        run: bash packaging/linux/make-appimage.sh "$RUNNER_TEMP/stage/usr" "$RUNNER_TEMP/appimagetool-x86_64.AppImage" "$RUNNER_TEMP/runtime-x86_64" "dist/transom-$VER-linux-x86_64.AppImage"
      - name: Deb
        run: bash packaging/linux/make-deb.sh "$RUNNER_TEMP/stage/usr" "$DEBVER" "dist/transom-$VER-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: transom-linux-x86_64-appimage
          path: dist/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: transom-linux-amd64-deb
          path: dist/*.deb
          if-no-files-found: error

  linux-smoke:
    needs: linux-build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
    steps:
      # No git in these clean images, so checkout falls back to the REST API download.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: transom-linux-*
          merge-multiple: true
          path: dist
      - name: Smoke test
        env:
          APPVER: ${{ needs.linux-build.outputs.version }}
        run: bash packaging/linux/smoke-test.sh dist "$APPVER"

  publish:
    needs: [windows, linux-build, linux-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check artifacts
        run: |
          ls -l dist
          count() { find dist -maxdepth 1 -type f -name "$1" | wc -l; }
          if [ "$(find dist -type f | wc -l)" -ne 3 ] || [ "$(count '*-windows-x64.zip')" -ne 1 ] || [ "$(count '*-linux-x86_64.AppImage')" -ne 1 ] || [ "$(count '*-linux-amd64.deb')" -ne 1 ]; then
            echo "::error::Expected exactly one Windows zip, one AppImage and one .deb in dist"
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Transom $GITHUB_REF_NAME" --generate-notes
